# VansGo Docker Compose
# Usage:
#   1. cp .env.example .env && nano .env
#   2. docker compose up -d
#   3. Open http://localhost:20128/masuk

services:
  vansgo:
    # Multi-arch image (amd64 + arm64 in one manifest); use vansgo:go-local for a local build.
    image: ${VANSGO_IMAGE:-ghcr.io/zanonaa/vansgo:latest}
    container_name: vansgo
    restart: unless-stopped
    ports:
      # Local-only by default; expose through an HTTPS reverse proxy if needed.
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-20128}:20128"
    volumes:
      - vansgo-data:/app/data
      # Compatibility source for pre-v0.91.22 named-volume installs of the
      # former VansRouter project. Bind-mount users must keep their existing
      # host path or migrate it first. The Go startup migration imports legacy
      # data without discarding the source.
      - vansrouter-data:/migration-data:ro
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      # Headroom roda dentro desta imagem e o supervisor Go gerencia o proxy
      # em loopback. Para um headroom EXTERNO, aponte headroomUrl via PATCH
      # /api/settings (modo EXTERNAL_PROXY) — não há mais serviço sidecar.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:20128/api/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# Headroom tornou-se parte da própria imagem vansgo (venv Python em
# /opt/headroom-venv). O proxy é spawnado pelo supervisor Go quando o toggle
# da dashboard está ativo — não há mais serviço/sidecar extra nesta stack.

volumes:
  vansgo-data:
    name: vansgo-data
  vansrouter-data:
    name: vansrouter-data
